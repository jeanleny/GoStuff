name : Clicker CI Pipeline

permissions:
  contents: read

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: clicker/go.mod

      - name: Build Clicker
        run: cd clicker && make

